<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="740" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionPatch - packages and how the app reaches them</text>
  <text class="subtitle" x="40" y="78">The core owns the outbox contract and the dispatcher; EF Core storage, the broker sinks and the test helpers are opt-in packages.</text>

  <!-- row 1: app, core, testing -->
  <rect class="step" x="40" y="120" width="250" height="160" rx="14"/>
  <text class="label" x="165" y="150" text-anchor="middle">Your app</text>
  <text class="code" x="60" y="180">AddOrionPatch()</text>
  <text class="code" x="60" y="204">outbox.Enqueue(msg)</text>
  <text class="code" x="60" y="228">SaveChangesAsync()</text>
  <text class="small" x="60" y="258">one transaction with your data</text>

  <path class="flow" d="M290,200 L348,200"/>
  <text class="edge" x="319" y="190" text-anchor="middle">calls</text>

  <rect class="step" x="350" y="120" width="500" height="220" rx="14"/>
  <text class="label" x="600" y="150" text-anchor="middle">OrionPatch (core)</text>
  <text class="code" x="372" y="180">IOutbox, IOutboxSink, IOutboxStorage</text>
  <text class="code" x="372" y="204">OutboxDispatcherHostedService</text>
  <text class="code" x="372" y="228">OrionPatchOptions, BackoffStrategy</text>
  <text class="code" x="372" y="252">ChannelOutboxSink, InMemoryInbox</text>
  <text class="code" x="372" y="276">IDeadLetterStore, IDeadLetterReplayStore</text>
  <text class="code" x="372" y="300">IOutboxArchivalStore, OrionPatchDiagnostics</text>
  <text class="small" x="372" y="326">built on Orion.Abstractions; no EF Core, no broker</text>

  <path class="flow" d="M850,200 L908,200"/>
  <text class="edge" x="879" y="190" text-anchor="middle">in tests</text>

  <rect class="step" x="910" y="120" width="250" height="160" rx="14"/>
  <text class="label" x="1035" y="150" text-anchor="middle">OrionPatch.Testing</text>
  <text class="code" x="930" y="180">UseInMemory()</text>
  <text class="code" x="930" y="204">DeterministicDispatcher</text>
  <text class="code" x="930" y="228">CapturingOutboxSink</text>
  <text class="code" x="930" y="252">TestClock, OutboxAssertions</text>

  <!-- buses from the core -->
  <path class="flow" d="M450,340 L450,375 L230,375 L230,408"/>
  <text class="edge" x="244" y="367">IOutbox + IOutboxStorage</text>

  <path class="flow" d="M750,340 L750,375 L580,375 L580,408"/>
  <path class="flow" d="M750,375 L815,375 L815,408"/>
  <path class="flow" d="M815,375 L1050,375 L1050,408"/>
  <text class="edge" x="840" y="367">IOutboxSink</text>

  <!-- row 2: storage and sinks -->
  <rect class="step" x="40" y="410" width="380" height="164" rx="14"/>
  <text class="label" x="230" y="440" text-anchor="middle">OrionPatch.EntityFrameworkCore</text>
  <text class="code" x="60" y="466">UseEntityFrameworkCore&lt;TDbContext&gt;()</text>
  <text class="code" x="60" y="490">UseOrionPatch(sp)</text>
  <text class="code" x="60" y="514">ApplyOrionPatchConfiguration()</text>
  <text class="code" x="60" y="538">UseEntityFrameworkCoreInbox&lt;T&gt;()</text>
  <text class="small" x="60" y="562">SaveChanges interceptor, provider-native claim</text>

  <rect class="step" x="470" y="410" width="220" height="120" rx="14"/>
  <text class="label" x="580" y="438" text-anchor="middle">Kafka sink</text>
  <text class="code" x="580" y="462" text-anchor="middle">OrionPatch.Kafka</text>
  <text class="small" x="580" y="486" text-anchor="middle">AddOrionPatchKafkaSink</text>
  <text class="small" x="580" y="508" text-anchor="middle">+ AddOrionPatchKafkaInbox</text>

  <rect class="step" x="705" y="410" width="220" height="120" rx="14"/>
  <text class="label" x="815" y="438" text-anchor="middle">RabbitMQ sink</text>
  <text class="code" x="815" y="462" text-anchor="middle">OrionPatch.RabbitMQ</text>
  <text class="small" x="815" y="486" text-anchor="middle">AddOrionPatchRabbitMqSink</text>
  <text class="small" x="815" y="508" text-anchor="middle">+ AddOrionPatchRabbitMqConsumer</text>

  <rect class="step" x="940" y="410" width="220" height="120" rx="14"/>
  <text class="label" x="1050" y="438" text-anchor="middle">Azure Service Bus sink</text>
  <text class="code" x="1050" y="462" text-anchor="middle">OrionPatch.AzureServiceBus</text>
  <text class="small" x="1050" y="486" text-anchor="middle">AddOrionPatchAzureServiceBusSink</text>
  <text class="small" x="1050" y="508" text-anchor="middle">queue or topic (EntityPath)</text>

  <!-- row 3: external systems -->
  <path class="flow" d="M230,574 L230,618"/>
  <text class="edge" x="242" y="602">tables</text>

  <rect class="ext" x="40" y="620" width="380" height="90" rx="14"/>
  <text class="label" x="230" y="648" text-anchor="middle">Your database</text>
  <text class="small" x="230" y="672" text-anchor="middle">SQL Server, PostgreSQL, MySQL, SQLite</text>
  <text class="small" x="230" y="694" text-anchor="middle">OrionPatch_Outbox, _DeadLetter, _OutboxArchive, _Inbox</text>

  <path class="flow" d="M580,530 L580,618"/>
  <path class="flow" d="M815,530 L815,618"/>
  <path class="flow" d="M1050,530 L1050,618"/>

  <rect class="ext" x="470" y="620" width="220" height="90" rx="14"/>
  <text class="label" x="580" y="652" text-anchor="middle">Apache Kafka</text>
  <text class="small" x="580" y="678" text-anchor="middle">key = envelope id</text>

  <rect class="ext" x="705" y="620" width="220" height="90" rx="14"/>
  <text class="label" x="815" y="652" text-anchor="middle">RabbitMQ</text>
  <text class="small" x="815" y="678" text-anchor="middle">exchange + routing key</text>

  <rect class="ext" x="940" y="620" width="220" height="90" rx="14"/>
  <text class="label" x="1050" y="652" text-anchor="middle">Azure Service Bus</text>
  <text class="small" x="1050" y="678" text-anchor="middle">MessageId = envelope id</text>
</svg>
